<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CRM{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ddd; }
    .flash { background: #e6f4ea; padding: .5rem 1rem; border-radius: 4px; }
    .error { color: #b00020; margin: .2rem 0; }
    .pipeline span { margin-right: 1.5rem; }
    label { display: block; margin: .5rem 0; }
  </style>
</head>
<body>
  <h1><a href="/contacts">Contacts</a></h1>
  {% for message in get_flashed_messages() %}
  <p class="flash" role="status">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
